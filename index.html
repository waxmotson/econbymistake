<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="econbymistake.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="ECONOMICS BY MISTAKE">
  <meta property="og:description" content="all of the HSC and select preliminary economics multiple choice questions">
  <meta property="og:image" content="https://econbymistake.onrender.com/boomvstrough.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">




  
  <title>ECONOMICS BY MISTAKE</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
      background-color: rgb(29, 32, 31);
      color:white;
    }
    h1 {
      font-size: 3rem;
      word-break: break-all;
      color:aqua;
    }
    h2 {
        font-size: 2rem;
    }
    h3 {
        font-style: italic;
        color:burlywood;
    }
    img {
        max-width: 100%;
        max-height: 40vh;   /* or whatever value you want, e.g. 500px */
        border: 1px solid #ccc;
        margin: 20px 0;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    button {
      font-size: 1.4rem;
      padding: 12px 28px;
      cursor: pointer;
    }
    #result {
      font-size: 2rem;
      margin-top: 24px;
      font-weight: bold;
    }





  </style>
</head>
<body>
  <div class="flex-container">
    <h2>ECONOMICS BY MISTAKE</h2>
    <h1 id="title"></h1>
  </div>
  
  <img id="question-img" alt="Question">
  
  <div class="buttons">
    <button onclick="check('A')">A</button>
    <button onclick="check('B')">B</button>
    <button onclick="check('C')">C</button>
    <button onclick="check('D')">D</button>
  </div>

  <h2 id="result"></h2>
  <h3 id="message"></h3>

  <button id="reloader" hidden=true onclick="window.location.reload();">NEXT</button>
  <script src="streak.js"></script>
  <script src="answers.js"></script>
  <script src="main.js"></script>
  <script>
    const clickSound = new Audio('vine2.mp3');
    let answered = false;
    

    const correct = ["Are you Jim Chalmers?", "That was an easy one.", "Lucky guess.", "Someone's been studying.", "Ceteris paribus.", "BOOM vs trough"]

    const incorrect = ["Someone needs to study.", "Misclick?", "Putting the mistake in ECONOMICS BY MISTAKE", "You are a negative externality", "You are a demerit good", "Your intelligence is in a contractionary phase", "Thinking deficit", "boom vs TROUGH", "bum"]

    let current = null;

    function loadRandom() {
      answered = false;
  
      document.querySelectorAll('.buttons button').forEach(btn => {
          btn.disabled = false;
      });
    
      
      current = answers[Math.floor(Math.random() * answers.length)];
      document.getElementById('title').textContent = current.question;
      document.getElementById('question-img').src = 'static/' + current.question;
      document.getElementById('result').textContent = '';
    }

    function check(choice) {

        if (answered) return;
        answered = true;
    
        document.querySelectorAll('.buttons button').forEach(btn => {
            btn.disabled = true;
        });


        
      
        clickSound.currentTime = 0;   // rewind so it can play repeatedly
        clickSound.play();
        document.getElementById("reloader").hidden = false;

      
        if (choice == current.answer) {
            recordAnswer(true);
            document.getElementById('result').textContent = 
            'CORRECT ANSWER: ' + current.answer; 
            document.getElementById('message').textContent=
            correct[Math.floor(Math.random()*correct.length)];
            document.getElementById('result').style.color = 'lawngreen';
        } else {
            recordAnswer(false);
            document.getElementById('result').textContent = 
            'Incorrect, it was: ' + current.answer;
            document.getElementById('message').textContent=
            incorrect[Math.floor(Math.random()*incorrect.length)];
            document.getElementById('result').style.color = 'firebrick';
        }



        
    }

    loadRandom();
  </script>
</body>
</html>
